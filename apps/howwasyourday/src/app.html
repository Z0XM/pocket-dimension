<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>How Was Your Day</title>
    <meta name="title" content="How Was Your Day" />
    <meta name="description" content="Track and reflect on your daily experiences" />
    <meta name="author" content="Z0XM" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="How Was Your Day" />
    <meta property="og:description" content="Track and reflect on your daily experiences" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="How Was Your Day" />
    <meta name="twitter:description" content="Track and reflect on your daily experiences" />

    <!-- Icons -->
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#eef4f1" />

    <!-- Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="How Was Your Day" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="How Was Your Day" />

    %sveltekit.head%
    <script>
      // Apply saved accent color from localStorage before first paint (light paper theme)
      (() => {
        try {
          const hex = localStorage.getItem("hwyd-theme-color");
          if (!hex) return;
          const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          if (!result) return;
          const r = parseInt(result[1], 16) / 255;
          const g = parseInt(result[2], 16) / 255;
          const b = parseInt(result[3], 16) / 255;
          const max = Math.max(r, g, b),
            min = Math.min(r, g, b),
            d = max - min;
          let h = 0;
          let s = 0;
          let l = (max + min) / 2;
          if (d !== 0) {
            s = d / (1 - Math.abs(2 * l - 1));
            if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
            else if (max === g) h = ((b - r) / d + 2) * 60;
            else h = ((r - g) / d + 4) * 60;
          }
          h = Math.round(h * 10) / 10;
          s = Math.round(s * 1000) / 10;
          l = Math.round(l * 1000) / 10;
          const primaryL = Math.min(Math.max(l, 18), 42);
          const sProp = document.documentElement.style;
          const normalized = "#" + result[1] + result[2] + result[3];
          sProp.setProperty("--brand", normalized);
          sProp.setProperty("--primary", h + " " + s + "% " + primaryL + "%");
          sProp.setProperty("--primary-foreground", "140 20% 97%");
          sProp.setProperty("--ring", h + " " + s + "% " + Math.min(primaryL + 8, 48) + "%");
          sProp.setProperty("--accent", h + " 16% 92%");
          sProp.setProperty("--accent-foreground", "189 28% 11%");
          sProp.setProperty("--sidebar-primary", h + " " + s + "% " + primaryL + "%");
          sProp.setProperty("--sidebar-ring", h + " " + s + "% " + Math.min(primaryL + 8, 48) + "%");
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
