<!doctype html>
<html lang="en" data-fonts="gaegu" data-paper="dots">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chhan Chhan</title>
    <meta name="title" content="Chhan Chhan" />
    <meta name="description" content="Personal finance and transaction tracking — beta." />
    <meta name="author" content="Z0XM" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chhan Chhan" />
    <meta property="og:description" content="Personal finance and transaction tracking — beta." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chhan Chhan" />
    <meta name="twitter:description" content="Personal finance and transaction tracking — beta." />
    <link rel="icon" href="%sveltekit.assets%/icon.png" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="%sveltekit.assets%/icon-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%sveltekit.assets%/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fffefd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fffefd" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Assistant:wght@400;600;700&family=Caveat:wght@500;700&family=Gaegu:wght@400;700&family=Indie+Flower&family=Kalam:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Assistant:wght@400;600;700&family=Caveat:wght@500;700&family=Gaegu:wght@400;700&family=Indie+Flower&family=Kalam:wght@400;700&display=swap"
      />
    </noscript>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("chhan-appearance");
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed.fonts === "string") {
            document.documentElement.setAttribute("data-fonts", parsed.fonts);
          }
          if (parsed && typeof parsed.paper === "string") {
            document.documentElement.setAttribute("data-paper", parsed.paper);
          }
        } catch (_) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
