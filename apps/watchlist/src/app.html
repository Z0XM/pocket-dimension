<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Watchlist by Z0XM</title>
    <meta name="title" content="Watchlist by Z0XM" />
    <meta
      name="description"
      content="Manage your watchlist and track your favorite shows, movies, and content. Organize what you want to watch, what you're watching, and what you've watched."
    />
    <meta name="keywords" content="watchlist, movies, tv shows, tracking, entertainment, media" />
    <meta name="author" content="Z0XM" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Watchlist by Z0XM" />
    <meta
      property="og:description"
      content="Manage your watchlist and track your favorite shows, movies, and content. Organize what you want to watch, what you're watching, and what you've watched."
    />
    <meta property="og:image" content="%sveltekit.assets%/icon.svg" />
    <meta property="og:site_name" content="Watchlist" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Watchlist by Z0XM" />
    <meta
      name="twitter:description"
      content="Manage your watchlist and track your favorite shows, movies, and content. Organize what you want to watch, what you're watching, and what you've watched."
    />
    <meta name="twitter:image" content="%sveltekit.assets%/icon.svg" />

    <!-- Icons -->
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon.svg" />

    <!-- Web App -->
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Watchlist" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Watchlist" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
