<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dashboard — Overview</title>
    <style>
      /* DESIGN.md Colors, Typography, Layout; EXPERIENCE.md Overview + section nav */
      :root {
        --bg: #0a0a0a;
        --surface: #111111;
        --fg: #f5f5f5;
        --muted: #a3a3a3;
        --border: #262626;
        --accent: #8b5cf6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #1a1a1a;
        color: var(--fg);
        font-family: "Fira Code", ui-monospace, monospace;
        font-size: 14px;
        line-height: 1.6;
      }
      .browser {
        max-width: 1100px;
        margin: 24px auto;
        border: 1px solid var(--border);
        background: var(--bg);
        min-height: 640px;
        display: flex;
        flex-direction: column;
      }
      .chrome { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; }
      .app { display: flex; flex: 1; min-height: 0; }
      aside {
        width: 280px;
        border-right: 1px solid var(--border);
        padding: 16px 12px;
        background: var(--bg);
      }
      .brand { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
      .tree { margin: 8px 0 16px; color: var(--fg); }
      nav a {
        display: block;
        padding: 8px 10px;
        color: var(--muted);
        text-decoration: none;
        border-left: 2px solid transparent;
      }
      nav a.active { color: var(--fg); background: var(--surface); border-left-color: var(--accent); }
      main { flex: 1; padding: 16px 24px; }
      h1 { font-size: 20px; font-weight: 500; margin: 0 0 16px; }
      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .card {
        border: 1px solid var(--border);
        background: var(--bg);
        padding: 12px;
      }
      .card strong { display: block; font-size: 20px; }
      .card span { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="browser">
      <div class="chrome">localhost:3011 · pocket-dimension</div>
      <div class="app">
        <aside>
          <div class="brand">dashboard</div>
          <div class="tree">pocket-dimension</div>
          <nav>
            <a class="active" href="#">Overview</a>
            <a href="#">Features</a>
            <a href="#">Epics &amp; Stories</a>
            <a href="#">Tests</a>
            <a href="#">Docs</a>
          </nav>
        </aside>
        <main>
          <h1>pocket-dimension</h1>
          <div class="cards">
            <div class="card"><strong>12</strong><span>Features</span></div>
            <div class="card"><strong>5</strong><span>Epics</span></div>
            <div class="card"><strong>24</strong><span>Stories</span></div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
