version: '3.8'

services:
  backend-api:
    build:
      context: .
      dockerfile: apps/backend/api/Dockerfile
      target: runner
    container_name: pocket-dimension-backend-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - pocket-dimension-network
    restart: unless-stopped

  web-z0xm:
    build:
      context: .
      dockerfile: apps/web/web-z0xm/Dockerfile
      target: runner
    container_name: pocket-dimension-web-z0xm
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - pocket-dimension-network
    restart: unless-stopped
    depends_on:
      - backend-api

networks:
  pocket-dimension-network:
    driver: bridge
